"209.0093" x="347.47" y="678.8538">Includes the PDF Report Service</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.1182" x="347.47" y="693.9866">and AI Feedback Service as</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.438" x="347.47" y="709.1194">in-process modules within the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.4063" x="347.47" y="724.2522">same Express application - they</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.2739" x="347.47" y="739.385">are not deployed as separate</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.7129" x="347.47" y="754.5178">artifacts.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.8086" x="347.47" y="769.6506">Secrets (DB credentials, JWT</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.6084" x="347.47" y="784.7835">signing key, OpenAI API key) are</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.1807" x="347.47" y="799.9163">managed via hosting-provider</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.436" x="347.47" y="815.0491">environment variables (NFR-1.1).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.0742" x="347.47" y="830.1819">No secret is committed to source</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="49.48" x="347.47" y="845.3147">control.</text></g><!--link Browser to Net--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="18"